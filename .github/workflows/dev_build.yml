name: CI

on:
  push:
    paths:
      - 'fo/**'
      - 'itest/**'
      - 'PORTING.md'
      - '.github/workflows/dev_build.yml'
  pull_request:
    paths:
      - 'fo/**'
      - 'itest/**'
      - 'PORTING.md'
      - '.github/workflows/dev_build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build Linux cubiomes native library
        if: runner.os == 'Linux'
        working-directory: fo
        run: ./natives/build-linux.sh

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        working-directory: fo
        run: chmod +x gradlew

      - name: Build & test (Unix)
        if: runner.os != 'Windows'
        working-directory: fo
        run: ./gradlew build --stacktrace --no-daemon

      - name: Build & test (Windows)
        if: runner.os == 'Windows'
        working-directory: fo
        shell: pwsh
        run: .\gradlew.bat build --stacktrace --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ runner.os }}
          path: fo/build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: FO-jar-${{ runner.os }}
          path: fo/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux native libs
        if: success() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: FO-native-linux-x86_64
          path: |
            fo/src/main/resources/natives/linux-x86_64/libCubiomesJNI.so
            fo/src/main/resources/natives/linux-x86_64/libcubiomes.so
          if-no-files-found: error
          retention-days: 14
