name: CI

on:
  push:
    paths:
      - 'fo/**'
      - 'itest/**'
      - 'PORTING.md'
      - '.github/workflows/dev_build.yml'
  pull_request:
    paths:
      - 'fo/**'
      - 'itest/**'
      - 'PORTING.md'
      - '.github/workflows/dev_build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Set up MSYS2 (Windows native build)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            make
            curl
            tar

      - name: Build Linux cubiomes native library
        if: runner.os == 'Linux'
        working-directory: fo
        run: ./natives/build-linux.sh

      - name: Build Windows cubiomes native library
        if: runner.os == 'Windows'
        working-directory: fo
        shell: msys2 {0}
        run: bash ./natives/build-windows.sh

      - name: Build macOS cubiomes native library
        if: runner.os == 'macOS'
        working-directory: fo
        run: ./natives/build-macos.sh

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        working-directory: fo
        run: chmod +x gradlew

      - name: Build & test (Unix)
        if: runner.os != 'Windows'
        working-directory: fo
        run: ./gradlew build --stacktrace --no-daemon

      - name: Build & test (Windows)
        if: runner.os == 'Windows'
        working-directory: fo
        shell: pwsh
        run: .\gradlew.bat build --stacktrace --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ runner.os }}
          path: fo/build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Linux native libs
        if: success() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: FO-native-linux-x86_64
          path: |
            fo/src/main/resources/natives/linux-x86_64/libCubiomesJNI.so
            fo/src/main/resources/natives/linux-x86_64/libcubiomes.so
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows native libs
        if: success() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: FO-native-windows-x86_64
          path: fo/src/main/resources/natives/windows/CubiomesJNI.dll
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS native libs
        if: success() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: FO-native-macos-universal
          path: fo/src/main/resources/natives/macos/libCubiomesJNI.dylib
          if-no-files-found: error
          retention-days: 14
